<!--
  Kartu preview "Open Graph" untuk link yang dibagikan (WhatsApp/IG/dll).

  CARA MEMBUAT ULANG src/app/opengraph-image.png:
    1. Buka file ini di browser.
    2. Set ukuran viewport ke 1200 x 630 (mis. lewat DevTools > Device Toolbar,
       atau "responsive" mode) dengan device pixel ratio 1.
    3. Screenshot area viewport (bukan full page) dan simpan sebagai
       src/app/opengraph-image.png.
  Font diambil dari Google Fonts, jadi butuh koneksi internet saat render.
  Kalau nama/kutipan di src/content/site.ts berubah, ulangi langkah di atas.
-->
<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Poppins:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        font-family: "Poppins", system-ui, sans-serif;
        background:
          radial-gradient(900px 520px at 50% -12%, #3a1526 0%, transparent 62%),
          #1b1218;
        color: #f3e8ee;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 0 110px;
      }
      .frame {
        position: absolute;
        inset: 26px;
        border: 1px solid rgba(224, 192, 106, 0.28);
        border-radius: 30px;
      }
      .heart {
        color: #f472b6;
        margin-bottom: 26px;
      }
      .eyebrow {
        font-size: 20px;
        font-weight: 500;
        letter-spacing: 0.5em;
        text-transform: uppercase;
        color: #e0c06a;
        margin-bottom: 22px;
        padding-left: 0.5em;
      }
      h1 {
        font-family: "Playfair Display", Georgia, serif;
        font-weight: 700;
        font-size: 84px;
        line-height: 1.05;
        color: #f472b6;
        letter-spacing: 0.01em;
      }
      .line {
        width: 260px;
        height: 3px;
        margin: 30px 0 28px;
        border-radius: 9999px;
        background: linear-gradient(to right, transparent, #e0c06a, transparent);
      }
      .quote {
        font-size: 30px;
        font-weight: 300;
        line-height: 1.45;
        color: rgba(243, 232, 238, 0.85);
        max-width: 900px;
      }
      .brand {
        position: absolute;
        bottom: 52px;
        font-size: 17px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: rgba(243, 232, 238, 0.45);
      }
    </style>
  </head>
  <body>
    <div class="frame"></div>
    <svg
      class="heart"
      width="58"
      height="58"
      viewBox="0 0 24 24"
      aria-hidden="true"
    >
      <path
        fill="currentColor"
        d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"
      />
    </svg>
    <div class="eyebrow">Untuk Kamu</div>
    <h1>FIKA ARISTIA PRATAMA</h1>
    <div class="line"></div>
    <p class="quote">
      Setiap detik bersamamu adalah bagian terindah dari ceritaku.
    </p>
    <div class="brand">Skyvee Tech</div>
  </body>
</html>
